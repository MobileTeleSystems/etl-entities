repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
        priority: 0
      - id: check-merge-conflict
        priority: 0
      - id: check-toml
        priority: 0
      - id: check-vcs-permalinks
        priority: 0
      - id: detect-private-key
        priority: 0
      - id: check-yaml
        args: [--unsafe]
        priority: 0
      - id: name-tests-test
        args: [--django]
        files: ^tests/.*\.py$
        exclude: ^tests/libs/.*\.py$
        priority: 0
      - id: end-of-file-fixer
        exclude: ^.*/VERSION$
        priority: 1
      - id: fix-byte-order-marker
        priority: 2
      - id: trailing-whitespace
        priority: 3

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
        priority: 0
      - id: rst-directive-colons
        priority: 0
      - id: rst-inline-touching-normal
        priority: 0

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: forbid-tabs
        priority: 0
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        priority: 4
      - id: insert-license
        files: .*\.py$
        exclude: ^(docs/.*\.py|tests/.*\.py)$
        args:
          - --license-filepath
          - .spdx-license-header.txt
          - --allow-past-years
          - --no-extra-eol
        priority: 5

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [-w]
        priority: 6

  - repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
    rev: v2.16.0
    hooks:
      - id: pretty-format-yaml
        args: [--autofix, --indent, '2', --preserve-quotes, --offset, '2']
        priority: 7

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.7
    hooks:
      - id: uv-lock
        priority: 7

  - repo: local
    hooks:
      - id: towncrier
        name: towncrier
        entry: towncrier build --draft
        language: system
        types: [rst]
        pass_filenames: false
        priority: 7

      - id: ruff-format
        name: ruff-format
        language: system
        entry: ruff format .
        types: [python]
        pass_filenames: false
        priority: 7

      - id: ruff-check
        name: ruff-check
        language: system
        entry: ruff check --fix
        types: [python]
        pass_filenames: false
        priority: 8

      - id: mypy
        name: mypy
        entry: mypy etl_entities
        language: system
        types: [python]
        pass_filenames: false
        priority: 9

  - repo: meta
    hooks:
      - id: check-hooks-apply
        priority: 0
      - id: check-useless-excludes
        priority: 0

ci:
  skip:
    - mypy # checked with Github Actions
    - ruff-format # checked with Github Actions
    - ruff-check # checked with Github Actions
    - towncrier # checked with Github Actions
